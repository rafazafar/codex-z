name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      commit_sha:
        description: "Fixed release commit to check; empty for PR checkout"
        required: true
        type: string

permissions:
  contents: read

# Cold CI builds skip incremental state and debug symbols, retaining debug assertions.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# A new PR commit supersedes the previous run. Release checks use a distinct group.
concurrency:
  group: checks-${{ github.workflow }}-${{ inputs.commit_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1

      # Reuse compiled dependencies; only release checks refresh the cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ inputs.commit_sha != '' }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check formatting
        if: runner.os == 'Linux'
        run: npm run format:check

      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Test TypeScript (full suite)
        if: runner.os == 'Linux'
        run: npm run test:typescript

      # Linux x64 covers governance, browser/contracts, and the nested Gate runner test.
      # Windows runs only platform-sensitive files (see tests/vitest.config.js);
      # pure-logic files are covered by the Linux and macOS lanes.
      - name: Test TypeScript (cross-platform)
        if: runner.os != 'Linux'
        env:
          CODEX_Z_TEST_SCOPE: ${{ runner.os == 'Windows' && 'platform' || '' }}
        run: >
          npm run test:typescript --
          --exclude 'packages/repository-automation/test/**'
          --exclude 'packages/shared-contracts/test/**'
          --exclude 'packages/renderer-extension/test/**'
          --exclude 'tools/gate-claude-code/run.test.mjs'

      # Rust formatting is already covered by the Linux x64 formatting step.
      - name: Check Rust
        run: >
          cargo clippy --workspace --all-targets --locked
          --features codex-z-shim/test-utils,codex-z-gate-a-native/gate-tools
          -- -D warnings && npm run test:rust

      - name: Smoke-test Linux npm package
        if: runner.os == 'Linux' && inputs.commit_sha == ''
        run: >
          node scripts/release/smoke-npm-package.mjs
          --target linux-x64
          --version 0.1.6-ci.0

  check-linux-arm64:
    name: Check Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global --prefer-offline npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.97.1

      # Reuse compiled dependencies; only release checks refresh the cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ inputs.commit_sha != '' }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      # Keep the same cross-platform coverage as macOS and Windows.
      - name: Test TypeScript (cross-platform)
        run: >
          npm run test:typescript --
          --exclude 'packages/repository-automation/test/**'
          --exclude 'packages/shared-contracts/test/**'
          --exclude 'packages/renderer-extension/test/**'
          --exclude 'tools/gate-claude-code/run.test.mjs'

      - name: Check Rust
        run: >
          cargo clippy --workspace --all-targets --locked
          --features codex-z-shim/test-utils,codex-z-gate-a-native/gate-tools
          -- -D warnings && npm run test:rust

      - name: Smoke-test Linux ARM64 npm package
        if: inputs.commit_sha == ''
        run: >
          node scripts/release/smoke-npm-package.mjs
          --target linux-arm64
          --version 0.1.6-ci.0
